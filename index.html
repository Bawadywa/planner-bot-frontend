<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <title>Planner</title>

    <!-- Telegram's SDK must load before the bundle: telegram.ts reads
         window.Telegram.WebApp during module init. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Runtime config, deliberately NOT bundled. It is copied verbatim from
         public/ into dist/, so the backend URL can be changed on a deployed
         build by editing one file - no rebuild. -->
    <script src="./config.js"></script>

    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
