name: Deploy to GitHub Pages

# Every push to main rebuilds and republishes, so the Mini App URL always
# serves the current source. Nothing built is committed to the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; drop the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Explicit, and it has to stay that way: setup-node v5 added automatic
          # caching driven by a `packageManager` field in package.json, and v6
          # narrowed that to npm only. Naming the cache here means neither
          # change decides anything for us.
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # public/.nojekyll is a dotfile, and v4 of this action stopped
          # including those in the artifact - silently, since a missing
          # .nojekyll only shows up as Jekyll mangling the published site
          # rather than as a failed build. v5 brought the input back.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
